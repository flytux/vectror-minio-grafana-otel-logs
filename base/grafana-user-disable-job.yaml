apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-user-disable-from-otel-logs
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: grafana-user-disable-from-otel-logs
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: query-clickhouse
              image: clickhouse/clickhouse-server:25.12
              env:
                - name: CLICKHOUSE_HOST
                  value: clickhouse-clickhouse-headless
                - name: CLICKHOUSE_USER
                  value: default
                - name: CLICKHOUSE_PASSWORD
                  value: clickhouse
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  until clickhouse-client \
                    --host "$CLICKHOUSE_HOST" \
                    --user "$CLICKHOUSE_USER" \
                    --password "$CLICKHOUSE_PASSWORD" \
                    --query "SELECT 1" >/dev/null 2>&1; do
                    echo "waiting for clickhouse..."
                    sleep 2
                  done

                  clickhouse-client \
                    --host "$CLICKHOUSE_HOST" \
                    --user "$CLICKHOUSE_USER" \
                    --password "$CLICKHOUSE_PASSWORD" \
                    --query "
                      SELECT DISTINCT LogAttributes['user'] AS deleted_user
                      FROM otel_logs
                      WHERE ServiceName = 'HGI-OIDC'
                        AND notEmpty(LogAttributes['user'])
                        AND LogAttributes['description'] LIKE '%삭제%완료%'
                        AND Timestamp >= now() - INTERVAL 7 DAY
                      ORDER BY deleted_user
                      FORMAT TSVRaw
                    " > /work/deleted_users.txt

                  echo "queried $(wc -l < /work/deleted_users.txt) deleted users"
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: disable-grafana-users
              image: curlimages/curl:8.12.1
              env:
                - name: GRAFANA_URL
                  value: http://grafana-service:3000
                - name: GRAFANA_ADMIN_USER
                  value: admin
                - name: GRAFANA_ADMIN_PASSWORD
                  value: admin
                - name: DELETED_USERS_FILE
                  value: /work/deleted_users.txt
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  response=/tmp/grafana-response.json
                  grafana_url=${GRAFANA_URL%/}

                  request() {
                    status="$(
                      curl -sS -o "$response" -w '%{http_code}' \
                        -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
                        -H 'Accept: application/json' \
                        "$@"
                    )"
                    body="$(cat "$response")"
                  }

                  ready=0
                  i=0
                  while [ "$i" -lt 60 ]; do
                    if curl -fsS -o /dev/null -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" "$grafana_url/api/health"; then
                      echo "grafana api is ready"
                      ready=1
                      break
                    fi
                    i=$((i + 1))
                    sleep 2
                  done
                  [ "$ready" -eq 1 ] || { echo "grafana api did not become ready in time" >&2; exit 1; }

                  matched=0
                  disabled=0
                  found=0

                  while IFS= read -r deleted_user || [ -n "$deleted_user" ]; do
                    [ -n "$deleted_user" ] || continue
                    found=1

                    request -G --data-urlencode "loginOrEmail=$deleted_user" "$grafana_url/api/users/lookup"
                    if [ "$status" = "404" ]; then
                      echo "lookup_miss user=$deleted_user"
                      continue
                    fi
                    [ "$status" = "200" ] || { echo "lookup_failed user=$deleted_user status=$status body=$body" >&2; exit 1; }

                    matched=$((matched + 1))
                    user_id="$(sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$response" | head -n 1)"
                    login="$(sed -n 's/.*"login":"\([^"]*\)".*/\1/p' "$response" | head -n 1)"
                    is_disabled="$(sed -n 's/.*"isDisabled":\([^,}]*\).*/\1/p' "$response" | head -n 1 | tr -d '[:space:]')"

                    [ -n "$user_id" ] || { echo "lookup_parse_failed user=$deleted_user body=$body" >&2; exit 1; }
                    [ -n "$login" ] || login="$deleted_user"

                    if [ "$is_disabled" = "true" ]; then
                      echo "already_disabled id=$user_id login=$login"
                      continue
                    fi

                    request -X POST "$grafana_url/api/admin/users/$user_id/disable"
                    [ "$status" = "200" ] || { echo "disable_failed id=$user_id login=$login status=$status body=$body" >&2; exit 1; }

                    disabled=$((disabled + 1))
                    echo "disabled id=$user_id login=$login"
                  done < "$DELETED_USERS_FILE"

                  [ "$found" -eq 1 ] || { echo "no deleted users found from clickhouse"; exit 0; }
                  echo "matched=$matched disabled=$disabled"
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
