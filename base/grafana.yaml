apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  clickhouse.yaml: |
    apiVersion: 1
    prune: true
    deleteDatasources:
      - name: ClickHouse
        orgId: 1
    datasources:
      - name: ClickHouse
        uid: clickhouse
        type: grafana-clickhouse-datasource
        access: proxy
        orgId: 1
        editable: true
        isDefault: true
        url: clickhouse-clickhouse-0-0-0.clickhouse-clickhouse-headless
        jsonData:
          host: clickhouse-clickhouse-0-0-0.clickhouse-clickhouse-headless
          port: 9000
          protocol: native
          username: default
          defaultDatabase: default
          validateSql: true
          logs:
            defaultDatabase: default
            defaultTable: otel_logs
            timeColumn: Timestamp
            filterTimeColumn: TimestampTime
            levelColumn: SeverityText
            messageColumn: Body
            selectContextColumns: true
            contextColumns:
              - TraceId
              - SpanId
              - ServiceName
              - LogAttributes
              - ResourceAttributes
            showLogLinks: true
          traces:
            defaultDatabase: default
            defaultTable: otel_traces
            traceIdColumn: TraceId
            spanIdColumn: SpanId
            parentSpanIdColumn: ParentSpanId
            operationNameColumn: SpanName
            serviceNameColumn: ServiceName
            durationColumn: Duration
            durationUnit: nanoseconds
            startTimeColumn: Timestamp
            tagsColumn: SpanAttributes
            serviceTagsColumn: ResourceAttributes
            kindColumn: SpanKind
            statusCodeColumn: StatusCode
            statusMessageColumn: StatusMessage
            traceTimestampTableSuffix: _trace_id_ts
        secureJsonData:
          password: clickhouse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: grafana-port
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin" # 초기 관리자 비밀번호
            - name: GF_PLUGINS_PREINSTALL
              value: "grafana-clickhouse-datasource"
            - name: GF_LOG_MODE
              value: "console file"
            - name: GF_PATHS_LOGS
              value: "/var/log/grafana"
            - name: GF_SERVER_ROUTER_LOGGING
              value: "true"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-logs
              mountPath: /var/log/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/clickhouse.yaml
              subPath: clickhouse.yaml
            - name: grafana-dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/minio-logs.yaml
              subPath: minio-logs.yaml
            - name: grafana-dashboards-minio-logs
              mountPath: /var/lib/grafana/dashboards/minio-logs
        - name: vector-grafana-audit
          image: timberio/vector:0.56.0-distroless-libc
          args:
            - --config
            - /etc/vector/vector.yaml
          volumeMounts:
            - name: grafana-logs
              mountPath: /var/log/grafana
            - name: grafana-audit-vector-config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
            - name: grafana-audit-vector-data
              mountPath: /var/lib/vector
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-logs
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
        - name: grafana-dashboards-minio-logs
          configMap:
            name: grafana-dashboards-minio-logs
        - name: grafana-audit-vector-config
          configMap:
            name: grafana-audit-vector-config
        - name: grafana-audit-vector-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: grafana-ingress
spec:
  ingressClassName: traefik
  rules:  
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
    - host: grafana.node-01
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
